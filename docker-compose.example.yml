services:
  hs2ts-adapter:
    build: .
    container_name: hs2ts-adapter
    restart: unless-stopped
    environment:
      # Required: full URL to your Headscale nodes endpoint
      HEADSCALE_API: https://<your-headscale>/api/v1/node
      # Optional overrides
      # LISTEN_HOST: 0.0.0.0
      # LISTEN_PORT: 8091
    ports:
      - "8091:8091"  # optional; not needed if other containers reach it internally
    networks:
      - termix-net

networks:
  termix-net:
    driver: bridge
